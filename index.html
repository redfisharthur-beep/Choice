<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ece9"><title>Choice｜一起決定</title>
<meta name="description" content="開房、投票、分析，或直接射鏢抽籤。">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./social.css"><link rel="stylesheet" href="./responsive.css"><link rel="stylesheet" href="./modal-fix.css"><link rel="stylesheet" href="./home.css">
<style>
#flowNav button[data-step="setup"]{background:#c8ddd5!important}
#flowNav button[data-step="vote"]{background:#d7e2dc!important}
#flowNav button[data-step="analysis"]{background:#e3dfd2!important}
#flowNav button[data-step="draw"]{background:#d5dce6!important}
#flowNav button.active{border-color:#82aa9f!important;box-shadow:inset 0 0 0 1px rgba(86,130,118,.18)!important}
#setupStep .setup-options>.small-note{display:none!important}
#setupStep .panel{padding-top:34px!important}
#setupStep h3{margin-top:0!important}
.setup-action-image{display:block!important;width:min(260px,88%)!important;max-height:118px!important;height:auto!important;object-fit:contain!important;margin:auto!important;pointer-events:none!important}
#setupStep .choice-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}
#setupStep .choice-actions .mode-choice{min-width:0!important;min-height:150px!important;padding:12px!important;display:grid!important;place-items:center!important}
.room-head-compact h2{transform:translateX(-34px)!important}
.room-head-compact .room-note-btn{width:150px!important;height:80px!important;right:8px!important}
.room-head-compact .room-note-btn img{width:140px!important;height:72px!important;object-fit:contain!important}
#lineReminderDialog .line-bind-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:10px!important;align-items:center!important;margin:18px 0!important}
#lineReminderDialog .line-bind-row #lineBindCommand{margin:0!important;min-width:0!important}
#lineReminderDialog .line-bind-row #copyLineBindBtn{width:auto!important;min-width:110px!important;margin:0!important;padding:0 18px!important;white-space:nowrap!important}
#lineReminderDialog .line-official-bottom{display:flex!important;justify-content:center!important;margin:30px auto 2px!important}
#lineReminderDialog .line-official-bottom img{display:block!important;width:74px!important;height:74px!important;object-fit:contain!important}
@media(max-width:600px){
  .setup-action-image{width:min(180px,94%)!important;max-height:92px!important}
  #setupStep .choice-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  #setupStep .choice-actions .mode-choice{min-height:118px!important;padding:8px!important}
  .room-head-compact h2{transform:translateX(-22px)!important}
  .room-head-compact .room-note-btn{width:132px!important;height:72px!important;right:4px!important}
  .room-head-compact .room-note-btn img{width:122px!important;height:66px!important}
  #lineReminderDialog .line-bind-row{grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important}
  #lineReminderDialog .line-bind-row #copyLineBindBtn{min-width:88px!important;padding:0 12px!important;font-size:17px!important}
  #lineReminderDialog .line-official-bottom img{width:68px!important;height:68px!important}
}
</style>
</head>
<body>
<div class="hero-actions" aria-label="Choice 功能">
  <button id="voiceBtn" class="hero-action-btn hero-mic-btn" type="button" aria-label="開啟麥克風"><img src="./assets/hero/mic.png" alt="麥克風"></button>
  <a class="hero-action-btn" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener" aria-label="Choice LINE 社群"><img src="./assets/hero/chat.png" alt="社群"></a>
</div>

<main class="shell">
  <section id="homeView" class="home-view">
    <div class="home-main-stage">
      <section class="home-band home-band-middle">
        <img src="./assets/hero/hero.png" alt="Choice" class="home-hero-image">
        <div class="home-login-row" aria-label="玩家登入">
          <input id="hostNameInput" class="home-name-input" maxlength="20" autocomplete="nickname" placeholder="輸入名字" aria-label="輸入名字">
          <button id="lineLoginBtn" class="home-line-login" type="button" aria-label="LINE 登入" title="LINE 登入"><img src="./assets/hero/line.png" alt="LINE 登入"></button>
        </div>
        <button id="openRoomBtn" class="room-image-btn" type="button" aria-label="建立房間"><img src="./assets/hero/room.png" alt="開房"></button>
      </section>
      <section class="home-band home-band-bottom room-directory" aria-label="房間列表"><div id="roomList" class="room-list"></div></section>
    </div>
  </section>

  <section id="roomView" class="room-view hidden">
    <div class="room-head room-head-compact card">
      <h2 id="roomTitle">我的 Choice</h2>
      <button id="lineReminderBtn" class="room-note-btn" type="button" aria-label="LINE提醒" title="LINE提醒"><img src="./assets/hero/note.png" onerror="this.onerror=null;this.src='./assets/hero/line.png'" alt="LINE提醒"></button>
      <span id="roomCodeText" hidden style="display:none!important">——</span><span id="participantCount" hidden style="display:none!important">1 人</span><span id="roleBadge" class="role-badge" hidden style="display:none!important">參與者</span>
    </div>

    <nav id="flowNav" class="flow-nav"><button data-step="setup" class="active">設定</button><button data-step="vote">投票</button><button data-step="analysis">分析</button><button data-step="draw">抽籤</button></nav>

    <div id="participantWaiting" class="participant-wait card">等待房主開始投票或抽籤…</div>

    <section id="setupStep" class="step active"><div class="card panel"><h3>選項</h3><div class="inline-add"><input id="optionInput" maxlength="30" placeholder="" aria-label="輸入一個項目"><button id="addOptionBtn">＋</button></div><div id="setupOptions" class="setup-options"></div><div class="choice-actions"><button id="goVoteBtn" class="mode-choice vote-choice" type="button" aria-label="開始投票"><img class="setup-action-image" src="./assets/stamp/stamp.png" onerror="this.onerror=null;this.src='./assets/stamp/vote.png'" alt="開始投票"></button><button id="goDrawBtn" class="mode-choice draw-choice" type="button" aria-label="直接抽籤"><img class="setup-action-image" src="./assets/dart/darts.png" onerror="this.onerror=null;this.src='./assets/dart/Darts%20fly.png'" alt="直接抽籤"></button></div></div></section>
    <section id="voteStep" class="step"><div class="card panel"><div class="panel-icon">🗳️</div><h3 id="pollTitleDisplay">投票</h3><div id="voteOptions" class="vote-options"></div><button id="voteBtn" class="big-btn" disabled>蓋章投票</button><div id="stampFx" class="stamp-fx">✓</div><button id="closeVoteBtn" class="soft-wide hidden">結束投票並看結果</button></div></section>
    <section id="analysisStep" class="step"><div class="card panel"><div class="panel-icon">📊</div><h3>投票結果</h3><div id="chartList" class="chart-list"></div><div id="insightText" class="winner-box">尚未投票</div><button id="analysisDrawBtn" class="soft-wide">再用抽籤決定 🎯</button><button id="announceVoteBtn" class="big-btn">公告決定</button></div></section>
    <section id="drawStep" class="step"><div class="card panel draw-panel"><div><div class="panel-icon">🎯</div><h3>勾選要抽的項目</h3><div id="drawChecks" class="draw-checks"></div></div><div class="draw-stage"><div class="dartboard" id="dartBoard"><span>🎯</span></div><div id="dart" class="dart">➳</div><button id="throwBtn" class="big-btn">射一鏢！</button><div id="drawResult" class="draw-result">準備好了嗎？</div><button id="announceDrawBtn" class="big-btn hidden">公告決定</button></div></div></section>

    <section class="player-strip card" aria-label="房間玩家"><div class="player-strip-head"><span id="voteProgressText">1 人在線</span></div><div id="playerList" class="player-list"></div></section>
    <div class="room-utility-actions"><button id="shareRoomBtn" class="soft-btn">分享房間</button><button id="leaveRoomBtn" class="soft-btn">離開房間</button></div>
  </section>
</main>

<dialog id="openRoomDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon choice-dialog-icon"><img src="./assets/stamp/choice.png" alt="Choice"></div><label>主題<input id="roomTopicInput" maxlength="50"></label><label>密碼<input id="roomPasswordInput" maxlength="20" type="password"></label><button id="createRoomBtn" class="big-btn">建立</button></dialog>
<dialog id="joinDialog" class="dialog join-password-dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon">🔐</div><h3>輸入房間密碼</h3><input id="joinNameInput" type="hidden"><label id="joinPasswordLabel">密碼<input id="joinPasswordInput" type="password" maxlength="20" autocomplete="current-password"></label><button id="joinWithPasswordBtn" class="big-btn">進入房間</button></dialog>
<dialog id="voiceDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon voice-dialog-icon"><img src="./assets/hero/mic.png" alt="麥克風"></div><h3>房間語音</h3><div class="voice-meter"><i id="voiceMeterBar"></i></div><button id="micTestBtn" class="soft-wide">測試麥克風</button><button id="joinVoiceBtn" class="big-btn">加入語音</button><button id="muteVoiceBtn" class="soft-wide hidden">靜音</button><button id="leaveVoiceBtn" class="soft-wide hidden">離開語音</button><p id="voiceStatus" class="small-note">進入房間後即可使用</p><div id="voiceAudioRack" hidden></div></dialog>
<dialog id="lineReminderDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><h3>LINE提醒</h3><p class="small-note">複製【綁定指令】後傳送到 Choice 官方 LINE</p><div class="line-bind-row"><div id="lineBindCommand" class="winner-box">綁定 ——</div><button id="copyLineBindBtn" class="soft-wide" type="button">複製</button></div><p id="lineConfigStatus" class="small-note">檢查 LINE 通知設定中…</p><a id="openLineBindBtn" class="line-official-bottom" href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener" aria-label="加入 Choice 官方 LINE" title="加入 Choice 官方 LINE"><img src="./assets/hero/line.png" alt="加入官方 LINE"></a></dialog>
<dialog id="announceDialog" class="dialog announce-dialog"><div class="announce-burst">🎉</div><span class="eyebrow">FINAL CHOICE</span><h2 id="announceResult">—</h2><p>決定完成！</p><div class="announce-social"><a href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 社群討論</a><a href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener">🔔 接收提醒</a></div><button class="big-btn" type="button" data-close>完成</button></dialog>

<span id="lineOfficialBtn" hidden aria-hidden="true"></span>
<div id="toast" class="toast"></div>
<script src="./config.js"></script><script src="./app.js"></script><script src="./home-login.js"></script><script src="./line-notify.js"></script><script src="./ui-fix.js"></script><script src="./join-flow.js"></script>
</body></html>
