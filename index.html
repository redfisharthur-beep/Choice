<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ece9">
<title>Choice｜一起決定</title>
<meta name="description" content="開房、投票，或直接射鏢抽籤。">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./social.css">
<link rel="stylesheet" href="./responsive.css">
<link rel="stylesheet" href="./modal-fix.css">
<link rel="stylesheet" href="./home.css">
<style>
/* Room UI: page-specific layout only. */
#roomView .room-head-compact{position:relative;background:#dce4e1;border:1px solid rgba(104,128,121,.16);box-shadow:none}
#roomView .room-title-wrap{position:relative;display:block;width:100%}
#roomView .room-head-compact h2{margin:0;text-align:center;font-size:32px;color:#667e86}
#roomView .room-deadline-top{font-size:20px}

body:has(#roomView:not(.hidden)) .hero-actions{gap:26px!important;padding-top:4px!important;overflow:visible!important}
body:has(#roomView:not(.hidden)) .hero-action-btn{width:68px!important;height:68px!important;overflow:visible!important}
body:has(#roomView:not(.hidden)) .hero-action-btn img{width:60px!important;height:60px!important;max-width:none!important;max-height:none!important;object-fit:contain!important;transform:none!important}
body:has(#roomView:not(.hidden)) .hero-mic-btn img{width:62px!important;height:62px!important}
body:has(#roomView:not(.hidden)) .hero-line-note-btn{width:132px!important;height:72px!important;overflow:visible!important}
body:has(#roomView:not(.hidden)) .hero-line-note-btn img{width:126px!important;height:72px!important;max-width:none!important;max-height:none!important;transform:none!important;object-fit:contain!important}

#lineReminderDialog #openLineBindBtn{display:grid!important;place-items:center!important;width:72px!important;height:72px!important;margin:18px auto 0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
#lineReminderDialog #openLineBindBtn img{display:block!important;width:64px!important;height:64px!important;max-width:64px!important;max-height:64px!important;object-fit:contain!important;transform:none!important}

#roomView .room-voted-badge{display:none!important;position:absolute;left:6px;top:50%;width:76px;height:76px;object-fit:contain;transform:translateY(-50%);z-index:4}
#roomView .room-voted-badge.show{display:block!important}

/* Vote / draw bears: real img elements only; remove all background artwork. */
#roomView #flowNav{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:34px!important;max-width:660px!important;margin:18px auto 22px!important;background:transparent!important;padding:0!important}
#roomView #flowNav button[data-step="setup"]{display:none!important}
html body #roomView #flowNav button[data-step="vote"],html body #roomView #flowNav button[data-step="draw"]{display:grid!important;place-items:center!important;min-height:168px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;background-image:none!important;box-shadow:none!important;opacity:1!important;pointer-events:auto!important;cursor:pointer!important;overflow:visible!important}
html body #roomView #flowNav button[data-step="vote"] img,html body #roomView #flowNav button[data-step="draw"] img{display:block!important;width:168px!important;height:168px!important;max-width:none!important;max-height:none!important;object-fit:contain!important;pointer-events:none!important}
#roomView #flowNav button.active{transform:scale(1.03)!important}

#roomView #setupStep .panel{padding:28px 30px 30px!important}
#roomView #setupStep .option-mode{display:flex!important;gap:12px!important;margin-bottom:18px!important}
#roomView #setupStep .option-mode button{min-width:130px!important;min-height:54px!important;padding:0 24px!important;border:1px solid rgba(92,116,108,.18)!important;border-radius:999px!important;background:#e8ece8!important;color:#627981!important;font-size:18px!important;box-shadow:none!important}
#roomView #setupStep .option-mode button.active{background:#c8dcd5!important;border-color:#91b2a8!important;color:#426b62!important;box-shadow:inset 0 0 0 1px rgba(78,132,118,.14)!important}
#roomView #setupStep .inline-add{gap:12px!important;margin-bottom:20px!important}
#roomView #setupStep .inline-add input{min-height:58px!important;border-radius:18px!important}
#roomView #setupStep #addOptionBtn{width:58px!important;height:58px!important;min-width:58px!important;border-radius:16px!important}
#roomView #setupStep .vote-settings{display:grid!important;grid-template-columns:1fr!important;gap:12px!important;margin-top:22px!important;padding:18px!important;border-radius:22px!important;background:#e4e9e6!important}
#roomView #setupStep .vote-setting{display:flex!important;align-items:center!important;gap:12px!important;min-height:58px!important;padding:10px 14px!important;margin:0!important;border:1px solid rgba(102,124,117,.12)!important;border-radius:17px!important;background:#f2f3ee!important;color:#60767d!important;box-sizing:border-box!important}
#roomView #setupStep .vote-setting.full{display:grid!important;grid-template-columns:auto minmax(0,1fr)!important}
#roomView #setupStep .vote-setting input[type="checkbox"]{width:24px!important;height:24px!important;flex:0 0 auto!important}
#roomView #setupStep .votes-per-person-setting{display:flex!important;align-items:center!important;gap:12px!important}
#roomView #setupStep #votesPerPersonInput{width:72px!important;min-height:42px!important;border:0!important;border-radius:14px!important;background:#fff!important;text-align:center!important;font-size:18px!important}
#roomView #setupStep #voteDeadlineInput:not(.has-value):not(:focus)::-webkit-datetime-edit{color:transparent!important}

html body #roomView #setupStep .choice-actions{display:flex!important;justify-content:center!important;align-items:center!important;margin-top:22px!important}
html body #roomView #setupStep #goVoteBtn{display:grid!important;place-items:center!important;width:min(220px,56vw)!important;min-height:0!important;height:auto!important;margin:0 auto!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;cursor:pointer!important}
html body #roomView #setupStep #goVoteBtn .setup-action-image{display:block!important;width:100%!important;max-width:220px!important;height:auto!important;max-height:none!important;margin:0!important;object-fit:contain!important}

#roomView #voteStep .panel{display:flex!important;flex-direction:column!important}
#roomView #pollTitleDisplay{order:1}
#roomView #voteDeadlineText{order:2}
#roomView #voteOptions{order:3;width:100%!important}
#roomView #voteBtn{order:4;margin-top:20px!important}
#roomView #analysisBtn{order:5}
#roomView #voteOptions .percent-row{position:relative!important;width:calc(100% - 92px)!important;margin-left:92px!important;box-sizing:border-box!important;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto!important;column-gap:0!important;padding-left:14px!important;padding-right:12px!important}
html body #roomView #voteOptions .percent-track{width:100%!important;max-width:none!important;margin:0!important;justify-self:stretch!important}
html body #roomView #voteOptions .percent-value{margin-left:0!important;padding-left:6px!important;white-space:nowrap!important}
#roomView #voteOptions .vote-choice-fx{position:absolute!important;left:-54px!important;top:50%!important;width:80px!important;height:80px!important;max-width:none!important;max-height:none!important;transform:translate(-50%,-50%)!important;object-fit:contain!important;z-index:5!important}

html body #roomView #analysisBtn.analysis-btn{display:block!important;order:5!important;width:min(448px,70vw)!important;height:auto!important;min-height:0!important;aspect-ratio:1/1!important;margin:20px auto 4px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent url('./assets/hero/analysis.png') center/contain no-repeat!important;box-shadow:none!important;font-size:0!important;color:transparent!important;overflow:visible!important;cursor:pointer!important}
html body #roomView #analysisBtn.analysis-btn::before,html body #roomView #analysisBtn.analysis-btn::after{display:none!important}

html body #roomView #drawHostControls{display:flex!important;flex-direction:column!important;align-items:center!important;gap:18px!important}
html body #roomView #drawChecks{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;gap:12px!important;width:min(660px,100%)!important;margin:0 auto!important}
html body #roomView #drawChecks .draw-check{width:100%!important;min-height:62px!important;margin:0!important;padding:10px 18px!important;border:2px solid rgba(105,131,122,.15)!important;border-radius:18px!important;background:#eef1ed!important;box-sizing:border-box!important;transition:.18s ease!important}
html body #roomView #drawChecks .draw-check:has(input:checked){background:linear-gradient(100deg,#fff1a9,#c8f0d8,#c7e7ff,#ffd8e6)!important;border-color:#fff!important;box-shadow:0 0 0 3px rgba(118,195,173,.35),0 8px 24px rgba(104,166,150,.22)!important;color:#315d65!important;font-weight:700!important;transform:scale(1.015)!important}
html body #roomView #drawChecks .draw-check:has(input:checked)::after{content:'✦';margin-left:auto;font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(65,119,104,.35)}
html body #roomView #drawChecks .draw-check input{width:24px!important;height:24px!important;accent-color:#74b9a8!important}
html body #roomView #throwBtn{width:min(170px,42vw)!important;min-height:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
html body #roomView #throwBtn img{display:block!important;width:100%!important;height:auto!important;max-width:none!important;max-height:none!important;object-fit:contain!important}
html body #roomView .draw-target-wrap{width:min(300px,52vw)!important;max-width:300px!important;margin:0 auto!important}
html body #roomView .draw-target-img{width:100%!important;height:auto!important;max-width:300px!important;object-fit:contain!important}
html body #roomView .draw-dart-img{width:34%!important;height:auto!important;max-width:110px!important;object-fit:contain!important}

#roomView .choice-chat{position:relative;z-index:2;pointer-events:auto}
#roomView .choice-chat-title,#roomView .choice-chat-empty{display:none!important}
#roomView .choice-chat-list:empty{display:none!important}
#roomView .choice-chat-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:0!important}
#roomView .choice-chat-compose input{display:block!important;min-height:52px!important;color:#3f5965!important;-webkit-text-fill-color:#3f5965!important;caret-color:#3f5965!important;background:#f5f5f1!important;opacity:1!important;visibility:visible!important;pointer-events:auto!important;font-size:19px!important}
#roomView .choice-chat-compose input::placeholder{color:#84979c!important;-webkit-text-fill-color:#84979c!important;opacity:1!important}
#roomView .choice-chat-compose button{font-size:18px}

html body #roomView .room-utility-actions{display:flex!important;justify-content:space-between!important;align-items:center!important;width:100%!important;margin:14px 0 0!important;padding:0!important;box-sizing:border-box!important;overflow:visible!important}
html body #roomView #outRoomBtn,html body #roomView #shareRoomBtn{width:190px!important;height:190px!important;min-width:190px!important;min-height:190px!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;box-shadow:none!important;display:grid!important;place-items:center!important;overflow:visible!important}
html body #roomView #outRoomBtn img,html body #roomView #shareRoomBtn img{display:block!important;width:178px!important;height:178px!important;max-width:none!important;max-height:none!important;object-fit:contain!important}

#openRoomDialog #createRoomBtn{appearance:none;border:0;background:transparent;box-shadow:none;padding:0;margin:18px auto 0;width:min(220px,56vw);display:block;cursor:pointer}
#openRoomDialog #createRoomBtn img{display:block;width:100%;height:auto;object-fit:contain}
#roomView .percent-name{font-size:21px}
#roomView .percent-value{font-size:18px}
#roomView .player-name,#roomView .player-choice{font-size:18px}
#roomView .vote-setting{font-size:20px}
#roomView .draw-check{font-size:22px}

@media(max-width:600px){
  body:has(#homeLoginPage:not(.hidden)):not(:has(#roomView:not(.hidden))):not(:has(#homeLobbyPage:not(.hidden))) .hero-actions{top:75px!important}
  #roomView .room-head-compact h2{font-size:28px}
  #roomView .room-deadline-top{font-size:18px}
  #roomView .room-voted-badge{left:2px;width:62px;height:62px}
  body:has(#roomView:not(.hidden)) .hero-actions{gap:16px!important}
  body:has(#roomView:not(.hidden)) .hero-action-btn{width:58px!important;height:58px!important}
  body:has(#roomView:not(.hidden)) .hero-action-btn img{width:52px!important;height:52px!important}
  body:has(#roomView:not(.hidden)) .hero-mic-btn img{width:55px!important;height:55px!important}
  body:has(#roomView:not(.hidden)) .hero-line-note-btn{width:112px!important;height:62px!important;overflow:visible!important}
  body:has(#roomView:not(.hidden)) .hero-line-note-btn img{width:108px!important;height:62px!important;max-width:none!important;max-height:none!important}
  #roomView #flowNav{gap:18px!important;max-width:390px!important}
  #roomView #flowNav button[data-step="vote"],#roomView #flowNav button[data-step="draw"]{min-height:138px!important}
  html body #roomView #flowNav button[data-step="vote"] img,html body #roomView #flowNav button[data-step="draw"] img{width:136px!important;height:136px!important}
  #roomView #setupStep .panel{padding:22px 18px 24px!important}
  #roomView #setupStep .option-mode button{min-width:112px!important;min-height:50px!important;font-size:17px!important;padding:0 20px!important}
  #roomView #setupStep .vote-settings{padding:14px!important;gap:10px!important}
  #roomView #setupStep .vote-setting{min-height:56px!important;font-size:18px!important;padding:10px 12px!important}
  html body #roomView #setupStep #goVoteBtn{width:min(190px,52vw)!important}
  html body #roomView #setupStep #goVoteBtn .setup-action-image{max-width:190px!important}
  #roomView #voteOptions .percent-row{width:calc(100% - 70px)!important;margin-left:70px!important;grid-template-columns:minmax(72px,106px) minmax(0,1fr) auto!important;padding-left:10px!important;padding-right:8px!important}
  #roomView #voteOptions .vote-choice-fx{left:-40px!important;width:64px!important;height:64px!important}
  html body #roomView #analysisBtn.analysis-btn{width:min(368px,82vw)!important;height:auto!important;aspect-ratio:1/1!important}
  html body #roomView #drawChecks{gap:10px!important}
  html body #roomView #drawChecks .draw-check{min-height:56px!important;padding:9px 14px!important;font-size:19px!important}
  html body #roomView #throwBtn{width:min(145px,40vw)!important}
  html body #roomView .draw-target-wrap{width:min(240px,58vw)!important;max-width:240px!important}
  html body #roomView .draw-target-img{max-width:240px!important}
  html body #roomView .draw-dart-img{max-width:88px!important}
  #roomView .choice-chat-compose input{font-size:18px!important}
  html body #roomView #outRoomBtn,html body #roomView #shareRoomBtn{width:156px!important;height:156px!important;min-width:156px!important;min-height:156px!important}
  html body #roomView #outRoomBtn img,html body #roomView #shareRoomBtn img{width:146px!important;height:146px!important;max-width:none!important;max-height:none!important}
  #openRoomDialog #createRoomBtn{width:min(190px,52vw)}
  #roomView .percent-name{font-size:19px}
}
</style>
</head>
<body>
<div class="hero-actions" aria-label="Choice 功能">
  <button id="voiceBtn" class="hero-action-btn hero-mic-btn" type="button" aria-label="開啟麥克風"><img src="./assets/hero/mic.png" alt="麥克風"></button>
  <a class="hero-action-btn" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener" aria-label="Choice LINE 社群"><img src="./assets/hero/chat.png" alt="社群"></a>
  <button id="lineReminderBtn" class="hero-action-btn hero-line-note-btn" type="button" aria-label="LINE提醒" title="LINE提醒"><img src="./assets/hero/note.png" onerror="this.onerror=null;this.src='./assets/hero/line.png'" alt="LINE提醒"></button>
</div>
<main class="shell">
<section id="homeView" class="home-view">
  <section id="homeLoginPage" class="home-page home-login-page" aria-label="登入 Choice">
    <img src="./assets/hero/hero.png" alt="Choice" class="home-hero-image">
    <div class="home-login-row" aria-label="玩家登入">
      <input id="hostNameInput" class="home-name-input" maxlength="20" autocomplete="nickname" placeholder="輸入名字" aria-label="輸入名字">
      <button id="lineLoginBtn" class="home-line-login" type="button" aria-label="LINE 登入" title="LINE 登入"><img src="./assets/hero/line.png" alt="LINE 登入"></button>
    </div>
    <button id="homeContinueBtn" class="home-login-image-btn" type="button" aria-label="進入 Choice"><img src="./assets/hero/go.png" alt="GO"></button>
  </section>
  <section id="homeLobbyPage" class="home-page home-lobby-page hidden" aria-label="主題與房間列表">
    <div class="home-lobby-top">
      <button id="homeBackBtn" class="home-back-btn" type="button" aria-label="返回登入">‹</button>
      <div id="homeLobbyName" class="home-lobby-name"></div>
      <button id="themePageBtn" class="theme-page-btn" type="button" aria-label="建立主題"><img src="./assets/hero/room.png" alt="主題"></button>
    </div>
    <section class="home-lobby-directory room-directory" aria-label="房間列表"><div id="roomList" class="room-list"></div></section>
  </section>
</section>

<section id="roomView" class="room-view hidden">
  <div class="room-head room-head-compact card">
    <div class="room-title-wrap"><img id="roomVotedBadge" class="room-voted-badge" src="./assets/stamp/vote.png" alt="已投票"><h2 id="roomTitle">我的 Choice</h2></div>
    <span id="roomCodeText" hidden>——</span><span id="participantCount" hidden>1 人</span>
  </div>
  <div id="roomDeadlineTop" class="room-deadline-top hidden" aria-live="polite"></div>
  <nav id="flowNav" class="flow-nav">
    <button type="button" data-step="setup" class="active">設定</button>
    <button type="button" data-step="vote" aria-label="查看投票狀況"><img src="./assets/stamp/stamp.png" alt="投票"></button>
    <button type="button" data-step="draw" aria-label="查看抽籤狀況"><img src="./assets/dart/darts.png" alt="抽籤"></button>
  </nav>

  <section id="setupStep" class="step active">
    <div class="card panel">
      <div class="option-mode"><button id="optionTextMode" type="button" class="active">文字</button><button id="optionDateMode" type="button">日期</button></div>
      <div class="inline-add"><input id="optionInput" maxlength="40" placeholder="" aria-label="新增選項"><button id="addOptionBtn" type="button">＋</button></div>
      <div id="setupOptions" class="setup-options"></div>
      <div class="vote-settings">
        <label class="vote-setting full"><span>投票截止時間</span><input id="voteDeadlineInput" type="datetime-local"></label>
        <label class="vote-setting"><input id="anonymousVoteInput" type="checkbox"><span>匿名投票</span></label>
        <label class="vote-setting votes-per-person-setting"><input id="repeatVoteInput" type="checkbox" aria-label="啟用多票"><span>每人</span><input id="votesPerPersonInput" type="number" min="1" max="20" value="1"><span>票</span></label>
      </div>
      <div class="choice-actions"><button id="goVoteBtn" class="mode-choice vote-choice" type="button" aria-label="建立投票房間"><img class="setup-action-image" src="./assets/hero/go.png" alt="GO"></button></div>
    </div>
  </section>

  <section id="voteStep" class="step">
    <div class="card panel"><h3 id="pollTitleDisplay">投票</h3><div id="voteDeadlineText" class="small-note"></div><div id="voteOptions" class="vote-options"></div><button id="voteBtn" class="big-btn" disabled>蓋章投票</button></div>
  </section>

  <section id="drawStep" class="step">
    <div id="drawPanel" class="card panel draw-panel">
      <div id="drawHostControls" class="draw-host-controls"><div id="drawChecks" class="draw-checks"></div><button id="throwBtn" type="button" aria-label="射擊抽籤"><img src="./assets/dart/Darts fly.png" alt="射擊"></button></div>
      <div class="draw-stage"><div class="draw-target-wrap"><img id="drawWheel" class="draw-target-img" src="./assets/target/target.png" alt="抽籤靶盤"><img id="drawDart" class="draw-dart-img" src="./assets/dart/Darts fly.png" alt="飛鏢"></div><div id="drawResult" class="draw-answer-pill hidden" aria-live="polite"></div><button id="announceDrawBtn" class="big-btn hidden">公告決定</button></div>
    </div>
  </section>

  <section class="player-strip card" aria-label="公開投票結果"><div id="playerList" class="player-list"></div></section>
  <div class="room-utility-actions"><button id="outRoomBtn" type="button" aria-label="離開房間回首頁"><img src="./assets/hero/out.png" alt="離開房間"></button><button id="shareRoomBtn" type="button" aria-label="分享房間"><img src="./assets/hero/share.png" alt="分享房間"></button></div>
</section>
</main>

<dialog id="openRoomDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon choice-dialog-icon"><img src="./assets/stamp/choice.png" alt="Choice"></div><label>主題<input id="roomTopicInput" maxlength="50"></label><label>密碼<input id="roomPasswordInput" maxlength="20" type="password"></label><button id="createRoomBtn" type="button" aria-label="建立房間"><img src="./assets/hero/go.png" alt="GO"></button></dialog>
<dialog id="joinDialog" class="dialog join-password-dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon">🔐</div><h3>輸入房間密碼</h3><input id="joinNameInput" type="hidden"><label id="joinPasswordLabel">密碼<input id="joinPasswordInput" type="password" maxlength="20" autocomplete="current-password"></label><button id="joinWithPasswordBtn" class="big-btn">進入房間</button></dialog>
<dialog id="voiceDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon voice-dialog-icon"><img src="./assets/hero/mic.png" alt="麥克風"></div><div class="voice-meter"><i id="voiceMeterBar"></i></div><button id="micTestBtn" class="soft-wide">測試麥克風</button><button id="joinVoiceBtn" class="big-btn">加入語音</button><button id="muteVoiceBtn" class="soft-wide hidden">靜音</button><button id="leaveVoiceBtn" class="soft-wide hidden">離開語音</button><p id="voiceStatus" class="small-note" aria-hidden="true"></p><div id="voiceAudioRack" hidden></div></dialog>
<dialog id="lineReminderDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><span id="lineBindCommand" hidden>綁定 ——</span><button id="copyLineBindBtn" class="line-copy-main" type="button">點選複製指令 傳送到官方Line</button><a id="openLineBindBtn" class="line-official-bottom" href="#" aria-label="加入 Choice 官方 LINE"><img src="./assets/hero/line.png" alt="加入官方 LINE"></a></dialog>

<span id="lineOfficialBtn" hidden aria-hidden="true"></span><div id="toast" class="toast"></div>

<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./home-login.js"></script>
<script src="./line-notify.js"></script>
<script>
(()=>{
  const loginPage=document.getElementById('homeLoginPage');
  const lobbyPage=document.getElementById('homeLobbyPage');
  const nameInput=document.getElementById('hostNameInput');
  const lobbyName=document.getElementById('homeLobbyName');
  const continueBtn=document.getElementById('homeContinueBtn');
  const backBtn=document.getElementById('homeBackBtn');
  const themeBtn=document.getElementById('themePageBtn');
  const deadlineInput=document.getElementById('voteDeadlineInput');
  const saved=localStorage.getItem('choice-display-name')||'';
  if(nameInput&&!nameInput.value)nameInput.value=saved;
  const syncDeadlineAppearance=()=>deadlineInput?.classList.toggle('has-value',!!deadlineInput.value);
  deadlineInput?.addEventListener('input',syncDeadlineAppearance);
  deadlineInput?.addEventListener('change',syncDeadlineAppearance);
  syncDeadlineAppearance();
  const showLogin=()=>{loginPage?.classList.remove('hidden');lobbyPage?.classList.add('hidden');setTimeout(()=>nameInput?.focus(),50)};
  const showLobby=()=>{const name=String(nameInput?.value||localStorage.getItem('choice-display-name')||'').trim().slice(0,20);if(!name){showLogin();const t=document.getElementById('toast');if(t){t.textContent='請先輸入名字';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}return false}localStorage.setItem('choice-display-name',name);try{if(typeof data!=='undefined')data.displayName=name}catch{}if(lobbyName)lobbyName.textContent=name;loginPage?.classList.add('hidden');lobbyPage?.classList.remove('hidden');return true};
  continueBtn?.addEventListener('click',showLobby);
  nameInput?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();showLobby()}});
  backBtn?.addEventListener('click',showLogin);
  themeBtn?.addEventListener('click',()=>{if(!showLobby())return;const dialog=document.getElementById('openRoomDialog');if(dialog&&!dialog.open)dialog.showModal()});
  document.getElementById('outRoomBtn')?.addEventListener('click',()=>{try{roomSocket?.close()}catch{}try{roomSocket=null}catch{}clearRoomState();showLobby()});
})();
</script>
</body>
</html>
