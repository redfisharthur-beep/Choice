<body>
<div class="hero-actions" aria-label="Choice 功能"><button id="voiceBtn" class="hero-action-btn hero-mic-btn" type="button" aria-label="開啟麥克風"><img src="./assets/hero/mic.png" alt="麥克風"></button><a class="hero-action-btn" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener" aria-label="Choice LINE 社群"><img src="./assets/hero/chat.png" alt="社群"></a><button id="lineReminderBtn" class="hero-action-btn hero-line-note-btn" type="button" aria-label="LINE提醒" title="LINE提醒"><img src="./assets/hero/note.png" onerror="this.onerror=null;this.src='./assets/hero/line.png'" alt="LINE提醒"></button></div>
<main class="shell">
<section id="homeView" class="home-view">
  <section id="homeLoginPage" class="home-page home-login-page" aria-label="登入 Choice">
    <img src="./assets/hero/hero.png" alt="Choice" class="home-hero-image">
    <div class="home-login-row" aria-label="玩家登入"><input id="hostNameInput" class="home-name-input" maxlength="20" autocomplete="nickname" placeholder="輸入名字" aria-label="輸入名字"><button id="lineLoginBtn" class="home-line-login" type="button" aria-label="LINE 登入" title="LINE 登入"><img src="./assets/hero/line.png" alt="LINE 登入"></button></div>
    <button id="homeContinueBtn" class="home-login-image-btn" type="button" aria-label="進入 Choice"><img src="./assets/hero/go.png" alt="GO"></button>
  </section>
  <section id="homeLobbyPage" class="home-page home-lobby-page hidden" aria-label="主題與房間列表">
    <div class="home-lobby-top">
      <button id="homeBackBtn" class="home-back-btn" type="button" aria-label="返回登入">‹</button>
      <div id="homeLobbyName" class="home-lobby-name"></div>
      <button id="themePageBtn" class="theme-page-btn" type="button" aria-label="建立主題"><img src="./assets/hero/room.png" alt="主題"></button>
    </div>
    <section class="home-lobby-directory room-directory" aria-label="房間列表"><div id="roomList" class="room-list"></div></section>
  </section>
</section>
<section id="roomView" class="room-view hidden">
<div class="room-head room-head-compact card"><div class="room-title-wrap"><img id="roomVotedBadge" class="room-voted-badge" src="./assets/stamp/vote.png" alt="已投票"><h2 id="roomTitle">我的 Choice</h2></div><span id="roomCodeText" hidden style="display:none!important">——</span><span id="participantCount" hidden style="display:none!important">1 人</span><span id="roleBadge" class="role-badge" hidden style="display:none!important">參與者</span></div>
<div id="roomDeadlineTop" class="room-deadline-top hidden" aria-live="polite"></div>
<nav id="flowNav" class="flow-nav"><button data-step="setup" class="active">設定</button><button data-step="vote" aria-label="查看投票狀況">投票</button><button data-step="draw" aria-label="查看抽籤狀況">抽籤</button></nav>
<section id="setupStep" class="step active"><div class="card panel"><div class="option-mode"><button id="optionTextMode" type="button" class="active">文字</button><button id="optionDateMode" type="button">日期</button></div><div class="inline-add"><input id="optionInput" maxlength="40" placeholder="" aria-label="新增選項"><button id="addOptionBtn">＋</button></div><div id="setupOptions" class="setup-options"></div><div class="vote-settings"><label class="vote-setting full"><span>投票截止時間</span><input id="voteDeadlineInput" type="datetime-local"></label><label class="vote-setting"><input id="anonymousVoteInput" type="checkbox"><span>匿名投票</span></label><label class="vote-setting repeat-setting"><input id="repeatVoteInput" type="checkbox"><span>可重複</span><span class="repeat-spacer">每人</span><input id="votesPerPersonInput" type="number" min="1" max="20" value="1"><span>票</span></label></div><div class="choice-actions"><button id="goVoteBtn" class="mode-choice vote-choice" type="button" aria-label="建立投票房間"><img class="setup-action-image" src="./assets/hero/go.png" alt="GO"></button></div></div></section>
<section id="voteStep" class="step"><div class="card panel"><h3 id="pollTitleDisplay">投票</h3><div id="voteDeadlineText" class="small-note"></div><div id="voteOptions" class="vote-options"></div><button id="voteBtn" class="big-btn" disabled>蓋章投票</button></div></section>
<section id="drawStep" class="step"><div id="drawPanel" class="card panel draw-panel"><div id="drawHostControls" class="draw-host-controls"><div id="drawChecks" class="draw-checks"></div><button id="throwBtn" type="button" aria-label="射擊抽籤"><img src="./assets/dart/Darts fly.png" alt="射擊"></button></div><div class="draw-stage"><div class="draw-target-wrap"><img id="drawWheel" class="draw-target-img" src="./assets/target/target.png" alt="抽籤靶盤"><img id="drawDart" class="draw-dart-img" src="./assets/dart/Darts fly.png" alt="飛鏢"></div><div id="drawResult" class="draw-answer-pill hidden" aria-live="polite"></div><button id="announceDrawBtn" class="big-btn hidden">公告決定</button></div></div></section>
<section class="player-strip card" aria-label="公開投票結果"><div id="playerList" class="player-list"></div></section>
<div class="room-utility-actions"><button id="outRoomBtn" type="button" aria-label="離開房間回首頁" title="離開房間回首頁"><img src="./assets/hero/out.png" alt="離開房間"></button><button id="shareRoomBtn" type="button" aria-label="分享房間" title="分享房間"><img src="./assets/hero/share.png" alt="分享房間"></button></div>
</section></main>
<dialog id="openRoomDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon choice-dialog-icon"><img src="./assets/stamp/choice.png" alt="Choice"></div><label>主題<input id="roomTopicInput" maxlength="50"></label><label>密碼<input id="roomPasswordInput" maxlength="20" type="password"></label><button id="createRoomBtn" type="button" aria-label="建立房間"><img src="./assets/hero/go.png" alt="GO"></button></dialog>
<dialog id="joinDialog" class="dialog join-password-dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon">🔐</div><h3>輸入房間密碼</h3><input id="joinNameInput" type="hidden"><label id="joinPasswordLabel">密碼<input id="joinPasswordInput" type="password" maxlength="20" autocomplete="current-password"></label><button id="joinWithPasswordBtn" class="big-btn">進入房間</button></dialog>
<dialog id="voiceDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon voice-dialog-icon"><img src="./assets/hero/mic.png" alt="麥克風"></div><div class="voice-meter"><i id="voiceMeterBar"></i></div><button id="micTestBtn" class="soft-wide">測試麥克風</button><button id="joinVoiceBtn" class="big-btn">加入語音</button><button id="muteVoiceBtn" class="soft-wide hidden">靜音</button><button id="leaveVoiceBtn" class="soft-wide hidden">離開語音</button><p id="voiceStatus" class="small-note" aria-hidden="true"></p><div id="voiceAudioRack" hidden></div></dialog>
<dialog id="lineReminderDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><span id="lineBindCommand" hidden>綁定 ——</span><button id="copyLineBindBtn" class="line-copy-main" type="button">點選複製指令 傳送到官方Line</button><a id="openLineBindBtn" class="line-official-bottom" href="#" aria-label="加入 Choice 官方 LINE" title="加入 Choice 官方 LINE"><img src="./assets/hero/line.png" alt="加入官方 LINE"></a></dialog>
<dialog id="announceDialog" class="dialog announce-dialog"><div class="announce-burst">🎉</div><span class="eyebrow">FINAL CHOICE</span><h2 id="announceResult">—</h2><p>決定完成！</p><div class="announce-social"><a href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 社群討論</a><a href="#" id="announceLineReminderLink">🔔 接收提醒</a></div><button class="big-btn" type="button" data-close>完成</button></dialog>
<span id="lineOfficialBtn" hidden aria-hidden="true"></span><div id="toast" class="toast"></div>
<script src="./config.js"></script><script src="./app.js"></script><script src="./home-login.js"></script><script src="./line-notify.js"></script>
<script>
(()=>{
  const loginPage=document.getElementById('homeLoginPage');
  const lobbyPage=document.getElementById('homeLobbyPage');
  const nameInput=document.getElementById('hostNameInput');
  const lobbyName=document.getElementById('homeLobbyName');
  const continueBtn=document.getElementById('homeContinueBtn');
  const backBtn=document.getElementById('homeBackBtn');
  const themeBtn=document.getElementById('themePageBtn');
  const saved=localStorage.getItem('choice-display-name')||'';
  if(nameInput&&!nameInput.value)nameInput.value=saved;
  const showLogin=()=>{loginPage?.classList.remove('hidden');lobbyPage?.classList.add('hidden');setTimeout(()=>nameInput?.focus(),50)};
  const showLobby=()=>{const name=String(nameInput?.value||localStorage.getItem('choice-display-name')||'').trim().slice(0,20);if(!name){showLogin();const t=document.getElementById('toast');if(t){t.textContent='請先輸入名字';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}return false}localStorage.setItem('choice-display-name',name);try{if(typeof data!=='undefined')data.displayName=name}catch{};if(lobbyName)lobbyName.textContent=name;loginPage?.classList.add('hidden');lobbyPage?.classList.remove('hidden');return true};
  continueBtn?.addEventListener('click',showLobby);
  nameInput?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();showLobby()}});
  backBtn?.addEventListener('click',showLogin);
  themeBtn?.addEventListener('click',()=>{if(!showLobby())return;const dialog=document.getElementById('openRoomDialog');if(dialog&&!dialog.open)dialog.showModal()});
  document.getElementById('outRoomBtn')?.addEventListener('click',()=>{try{roomSocket?.close()}catch{};try{roomSocket=null}catch{};clearRoomState();showLobby()});
})();
</script>
</body></html>
