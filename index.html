<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fffc"><title>Choice｜一起決定</title>
<meta name="description" content="開房、投票、分析，或直接射鏢抽籤。">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./social.css"><link rel="stylesheet" href="./responsive.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="logo">✓</span><b>Choice</b></a>
  <div class="top-actions"><a class="community-btn" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 社群</a><button id="voiceBtn" class="round-btn" title="語音">🎙️</button><button id="lineOfficialBtn" class="line-btn">LINE@</button></div>
</header>

<main class="shell">
  <section id="homeView" class="home-view">
    <div class="hero card">
      <div class="hero-copy"><span class="eyebrow">MAKE A CHOICE</span><h1>一起選，<br>更好玩。</h1><p>開一間房，投票或直接抽籤。</p><button id="openRoomBtn" class="big-btn">＋ 開房</button><div class="social-shortcuts"><a href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 加入社群</a><a href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener">🔔 官方 LINE</a></div></div>
      <div class="hero-art" aria-hidden="true"><div class="target-pop">🎯</div><div class="stamp-pop">✓</div><div class="bubble b1">🍓</div><div class="bubble b2">🌿</div><div class="bubble b3">⭐</div></div>
    </div>
    <div class="join-lite"><span>有房號？</span><input id="quickJoinCode" maxlength="6" placeholder="ABC123"><button id="quickJoinBtn">加入</button></div>
  </section>

  <section id="roomView" class="room-view hidden">
    <div class="room-head card"><div><span class="eyebrow">ROOM</span><h2 id="roomTitle">我的 Choice</h2><p>房號 <b id="roomCodeText">——</b> · <span id="participantCount">1 人</span> · <span id="roleBadge" class="role-badge">參與者</span></p></div><div class="room-head-actions"><button id="shareRoomBtn" class="soft-btn">分享</button><button id="leaveRoomBtn" class="soft-btn">離開</button></div></div>

    <nav id="flowNav" class="flow-nav">
      <button data-step="setup" class="active">1 設定</button><button data-step="vote">2 投票</button><button data-step="analysis">3 分析</button><button data-step="draw">🎯 抽籤</button>
    </nav>

    <section id="setupStep" class="step active">
      <div class="card panel">
        <div class="panel-icon">✏️</div><h3>填寫項目</h3>
        <div class="inline-add"><input id="optionInput" maxlength="30" placeholder="輸入一個項目"><button id="addOptionBtn">＋</button></div>
        <div id="setupOptions" class="setup-options"></div>
        <div class="choice-actions"><button id="goVoteBtn" class="mode-choice vote-choice"><span>🗳️</span><b>開始投票</b></button><button id="goDrawBtn" class="mode-choice draw-choice"><span>🎯</span><b>直接抽籤</b></button></div>
      </div>
    </section>

    <section id="voteStep" class="step">
      <div class="card panel"><div class="panel-icon">🗳️</div><h3 id="pollTitleDisplay">投票</h3><div id="voteOptions" class="vote-options"></div><button id="voteBtn" class="big-btn" disabled>蓋章投票</button><div id="stampFx" class="stamp-fx">✓</div><button id="closeVoteBtn" class="soft-wide hidden">結束投票並看結果</button></div>
    </section>

    <section id="analysisStep" class="step">
      <div class="card panel"><div class="panel-icon">📊</div><h3>投票結果</h3><div id="chartList" class="chart-list"></div><div id="insightText" class="winner-box">尚未投票</div><button id="analysisDrawBtn" class="soft-wide">再用抽籤決定 🎯</button><button id="announceVoteBtn" class="big-btn">公告決定</button></div>
    </section>

    <section id="drawStep" class="step">
      <div class="card panel draw-panel"><div><div class="panel-icon">🎯</div><h3>勾選要抽的項目</h3><div id="drawChecks" class="draw-checks"></div></div><div class="draw-stage"><div class="dartboard" id="dartBoard"><span>🎯</span></div><div id="dart" class="dart">➳</div><button id="throwBtn" class="big-btn">射一鏢！</button><div id="drawResult" class="draw-result">準備好了嗎？</div><button id="announceDrawBtn" class="big-btn hidden">公告決定</button></div></div>
    </section>
  </section>
</main>

<a id="lineFloat" class="line-float" href="#" aria-label="加入 Choice 官方 LINE"><span>LINE</span><b>提醒</b></a>
<a class="community-float" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener" aria-label="加入 Choice LINE 社群"><span>💬</span><b>社群</b></a>

<dialog id="openRoomDialog" class="dialog"><button class="x" data-close>×</button><div class="dialog-icon">🏠</div><h3>開一間 Choice</h3><label>主題<input id="roomTopicInput" maxlength="50" placeholder="例如：今晚吃什麼？"></label><label>房間密碼<input id="roomPasswordInput" maxlength="20" type="password" placeholder="可留空"></label><label class="checkline"><input id="noPasswordCheck" type="checkbox" checked> 無密碼</label><button id="createRoomBtn" class="big-btn">建立房間</button></dialog>

<dialog id="joinDialog" class="dialog"><button class="x" data-close>×</button><div class="dialog-icon">🔐</div><h3>加入房間</h3><input id="joinPasswordInput" type="password" maxlength="20" placeholder="輸入房間密碼"><button id="joinWithPasswordBtn" class="big-btn">加入</button></dialog>

<dialog id="voiceDialog" class="dialog"><button class="x" data-close>×</button><div class="dialog-icon">🎙️</div><h3>房間語音</h3><div class="voice-meter"><i id="voiceMeterBar"></i></div><button id="micTestBtn" class="soft-wide">測試麥克風</button><button id="joinVoiceBtn" class="big-btn" disabled>加入語音</button><p id="voiceStatus" class="small-note">等待 Cloudflare Realtime 綁定</p></dialog>

<dialog id="announceDialog" class="dialog announce-dialog"><div class="announce-burst">🎉</div><span class="eyebrow">FINAL CHOICE</span><h2 id="announceResult">—</h2><p>決定完成！</p><div class="announce-social"><a href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 社群討論</a><a href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener">🔔 接收提醒</a></div><button class="big-btn" data-close>完成</button></dialog>

<div id="toast" class="toast"></div>
<script src="./config.js"></script><script src="./app.js"></script>
</body></html>
