<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ece9"><title>Choice｜一起決定</title>
<meta name="description" content="開房、投票、分析，或直接射鏢抽籤。">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./social.css"><link rel="stylesheet" href="./responsive.css"><link rel="stylesheet" href="./modal-fix.css"><link rel="stylesheet" href="./home.css">
</head>
<body>
<header class="topbar home-topbar home-band-top">
  <a id="lineOfficialBtn" class="top-icon-link" href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener" aria-label="Choice 官方 LINE"><img src="./assets/hero/line.png" alt="LINE"></a>
  <button id="voiceBtn" class="top-icon-link top-mic-btn" type="button" aria-label="開啟麥克風"><img src="./assets/hero/mic.png" alt="麥克風"></button>
  <a class="top-icon-link" href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener" aria-label="Choice LINE 社群"><img src="./assets/hero/chat.png" alt="社群"></a>
</header>

<main class="shell">
  <section id="homeView" class="home-view">
    <div class="home-main-stage">
      <section class="home-band home-band-middle">
        <img src="./assets/hero/hero.png" alt="Choice" class="home-hero-image">
        <div class="home-login-row" aria-label="玩家登入">
          <input id="hostNameInput" class="home-name-input" maxlength="20" autocomplete="nickname" placeholder="輸入名字" aria-label="輸入名字">
          <button id="lineLoginBtn" class="home-line-login" type="button" aria-label="LINE 登入" title="LINE 登入"><img src="./assets/hero/line.png" alt="LINE 登入"></button>
        </div>
        <button id="openRoomBtn" class="room-image-btn" type="button" aria-label="建立房間"><img src="./assets/hero/room.png" alt="開房"></button>
      </section>
      <section class="home-band home-band-bottom room-directory" aria-label="房間列表"><div id="roomList" class="room-list"></div></section>
    </div>
  </section>

  <section id="roomView" class="room-view hidden">
    <div class="room-head card"><div><span class="eyebrow">ROOM</span><h2 id="roomTitle">我的 Choice</h2><p>房號 <b id="roomCodeText">——</b> · <span id="participantCount">1 人</span> · <span id="roleBadge" class="role-badge">參與者</span></p></div><div class="room-head-actions"><button id="lineReminderBtn" class="soft-btn">LINE提醒</button><button id="shareRoomBtn" class="soft-btn">分享</button><button id="leaveRoomBtn" class="soft-btn">離開</button></div></div>

    <section class="player-strip card" aria-label="房間玩家"><div class="player-strip-head"><span id="voteProgressText">1 人在線</span></div><div id="playerList" class="player-list"></div></section>

    <nav id="flowNav" class="flow-nav"><button data-step="setup" class="active">1 設定</button><button data-step="vote">2 投票</button><button data-step="analysis">3 分析</button><button data-step="draw">🎯 抽籤</button></nav>

    <section id="setupStep" class="step active"><div class="card panel"><div class="panel-icon">✏️</div><h3>填寫項目</h3><div class="inline-add"><input id="optionInput" maxlength="30" placeholder="輸入一個項目"><button id="addOptionBtn">＋</button></div><div id="setupOptions" class="setup-options"></div><div class="choice-actions"><button id="goVoteBtn" class="mode-choice vote-choice"><span>🗳️</span><b>開始投票</b></button><button id="goDrawBtn" class="mode-choice draw-choice"><span>🎯</span><b>直接抽籤</b></button></div></div></section>
    <section id="voteStep" class="step"><div class="card panel"><div class="panel-icon">🗳️</div><h3 id="pollTitleDisplay">投票</h3><div id="voteOptions" class="vote-options"></div><button id="voteBtn" class="big-btn" disabled>蓋章投票</button><div id="stampFx" class="stamp-fx">✓</div><button id="closeVoteBtn" class="soft-wide hidden">結束投票並看結果</button></div></section>
    <section id="analysisStep" class="step"><div class="card panel"><div class="panel-icon">📊</div><h3>投票結果</h3><div id="chartList" class="chart-list"></div><div id="insightText" class="winner-box">尚未投票</div><button id="analysisDrawBtn" class="soft-wide">再用抽籤決定 🎯</button><button id="announceVoteBtn" class="big-btn">公告決定</button></div></section>
    <section id="drawStep" class="step"><div class="card panel draw-panel"><div><div class="panel-icon">🎯</div><h3>勾選要抽的項目</h3><div id="drawChecks" class="draw-checks"></div></div><div class="draw-stage"><div class="dartboard" id="dartBoard"><span>🎯</span></div><div id="dart" class="dart">➳</div><button id="throwBtn" class="big-btn">射一鏢！</button><div id="drawResult" class="draw-result">準備好了嗎？</div><button id="announceDrawBtn" class="big-btn hidden">公告決定</button></div></div></section>
  </section>
</main>

<dialog id="openRoomDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon choice-dialog-icon"><img src="./assets/stamp/choice.png" alt="Choice"></div><label>主題<input id="roomTopicInput" maxlength="50"></label><label>密碼<input id="roomPasswordInput" maxlength="20" type="password"></label><button id="createRoomBtn" class="big-btn">建立</button></dialog>
<dialog id="joinDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon">👋</div><h3>加入房間</h3><label>名稱<input id="joinNameInput" maxlength="20" autocomplete="nickname"></label><label id="joinPasswordLabel">密碼<input id="joinPasswordInput" type="password" maxlength="20"></label><button id="joinWithPasswordBtn" class="big-btn">加入</button></dialog>
<dialog id="voiceDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon voice-dialog-icon"><img src="./assets/hero/mic.png" alt="麥克風"></div><h3>房間語音</h3><div class="voice-meter"><i id="voiceMeterBar"></i></div><button id="micTestBtn" class="soft-wide">測試麥克風</button><button id="joinVoiceBtn" class="big-btn">加入語音</button><button id="muteVoiceBtn" class="soft-wide hidden">靜音</button><button id="leaveVoiceBtn" class="soft-wide hidden">離開語音</button><p id="voiceStatus" class="small-note">進入房間後即可使用</p><div id="voiceAudioRack" hidden></div></dialog>
<dialog id="lineReminderDialog" class="dialog"><button class="x" type="button" data-close aria-label="關閉">×</button><div class="dialog-icon voice-dialog-icon"><img src="./assets/hero/line.png" alt="LINE"></div><h3>LINE提醒</h3><p class="small-note">到 Choice 官方 LINE 傳送：</p><div id="lineBindCommand" class="winner-box">綁定 ——</div><button id="copyLineBindBtn" class="soft-wide" type="button">複製綁定指令</button><a id="openLineBindBtn" class="big-btn" href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener">開啟官方 LINE</a><p id="lineConfigStatus" class="small-note">檢查 LINE 通知設定中…</p></dialog>
<dialog id="announceDialog" class="dialog announce-dialog"><div class="announce-burst">🎉</div><span class="eyebrow">FINAL CHOICE</span><h2 id="announceResult">—</h2><p>決定完成！</p><div class="announce-social"><a href="https://line.me/ti/g2/k29Jk_pZmJCCqt5jUZjxOLnv8RNnabWLeuFu4Q?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">💬 社群討論</a><a href="https://lin.ee/t5BkC6O" target="_blank" rel="noopener">🔔 接收提醒</a></div><button class="big-btn" type="button" data-close>完成</button></dialog>

<div id="toast" class="toast"></div>
<script src="./config.js"></script><script src="./app.js"></script><script src="./home-login.js"></script><script src="./line-notify.js"></script><script src="./ui-fix.js"></script>
</body></html>
